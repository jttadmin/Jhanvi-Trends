{{- if .Values.mongodb.enabled }}
{{- $m := .Values.mongodb }}
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    {{- include "jhanvi-trends.commonLabels" . | nindent 4 }}
    {{- include "jhanvi-trends.selector" "mongodb" | nindent 4 }}
spec:
  selector:
    {{- include "jhanvi-trends.selector" "mongodb" | nindent 4 }}
  ports:
    - { name: mongodb, port: 27017, targetPort: mongodb }
    - { name: metrics, port: 9216, targetPort: metrics }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    {{- include "jhanvi-trends.commonLabels" . | nindent 4 }}
    {{- include "jhanvi-trends.selector" "mongodb" | nindent 4 }}
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      {{- include "jhanvi-trends.selector" "mongodb" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jhanvi-trends.selector" "mongodb" | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: {{ $m.image }}
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          ports:
            - { name: mongodb, containerPort: 27017 }
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: {{ $m.user | quote }} }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.global.secretName }}, key: MONGODB_PASSWORD } }
          readinessProbe:
            exec: { command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"] }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 20
          livenessProbe:
            tcpSocket: { port: mongodb }
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data/db }
        - name: exporter
          image: {{ $m.exporter.image }}
          args: ["--collect-all", "--compatible-mode", "--web.listen-address=:9216"]
          ports:
            - { name: metrics, containerPort: 9216 }
          env:
            - name: MONGODB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.global.secretName }}, key: MONGODB_PASSWORD } }
            - name: MONGODB_URI
              value: "mongodb://{{ $m.user }}:$(MONGODB_PASSWORD)@localhost:27017/?authSource=admin"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $m.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $m.storage }}
{{- if .Values.monitoring.serviceMonitors }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mongodb
  labels:
    {{- include "jhanvi-trends.labels" . | nindent 4 }}
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      {{- include "jhanvi-trends.selector" "mongodb" | nindent 6 }}
  endpoints:
    - { port: metrics, interval: 30s }
{{- end }}
{{- end }}
