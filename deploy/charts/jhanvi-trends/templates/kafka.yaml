{{- if .Values.kafka.enabled }}
{{- $k := .Values.kafka }}
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "jhanvi-trends.commonLabels" . | nindent 4 }}
    {{- include "jhanvi-trends.selector" "kafka" | nindent 4 }}
spec:
  selector:
    {{- include "jhanvi-trends.selector" "kafka" | nindent 4 }}
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "jhanvi-trends.commonLabels" . | nindent 4 }}
    {{- include "jhanvi-trends.selector" "kafka" | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "jhanvi-trends.selector" "kafka" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jhanvi-trends.selector" "kafka" | nindent 8 }}
    spec:
      # Without this, Kubernetes injects KAFKA_PORT=tcp://... which the image reads as broker config.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ $k.image }}
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: CLUSTER_ID, value: {{ $k.clusterId | quote }} }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "72" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_HEAP_OPTS, value: {{ $k.heapOpts | quote }} }
          readinessProbe:
            tcpSocket: { port: kafka }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: controller }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml $k.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $k.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $k.storage }}
---
# Consumer-group lag, topic offsets and broker metrics for Prometheus.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  labels:
    {{- include "jhanvi-trends.commonLabels" . | nindent 4 }}
    {{- include "jhanvi-trends.selector" "kafka-exporter" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "jhanvi-trends.selector" "kafka-exporter" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jhanvi-trends.selector" "kafka-exporter" | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-exporter
          image: {{ $k.exporter.image }}
          args: ["--kafka.server=kafka:9092", "--kafka.version=3.0.0"]
          ports:
            - { name: metrics, containerPort: 9308 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  labels:
    {{- include "jhanvi-trends.commonLabels" . | nindent 4 }}
    {{- include "jhanvi-trends.selector" "kafka-exporter" | nindent 4 }}
spec:
  selector:
    {{- include "jhanvi-trends.selector" "kafka-exporter" | nindent 4 }}
  ports:
    - { name: metrics, port: 9308, targetPort: metrics }
{{- if .Values.monitoring.serviceMonitors }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-exporter
  labels:
    {{- include "jhanvi-trends.labels" . | nindent 4 }}
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      {{- include "jhanvi-trends.selector" "kafka-exporter" | nindent 6 }}
  endpoints:
    - { port: metrics, interval: 30s }
{{- end }}
{{- end }}
