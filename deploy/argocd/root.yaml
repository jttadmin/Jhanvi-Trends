# App of apps: kubectl apply -f deploy/argocd/project.yaml -f deploy/argocd/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jhanvi-trends-root
  namespace: argocd
spec:
  project: jhanvi-trends
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/jttadmin/jhanvi-trends.git
    targetRevision: main
    path: deploy/argocd/apps
  syncPolicy:
    automated: { prune: true, selfHeal: true }
