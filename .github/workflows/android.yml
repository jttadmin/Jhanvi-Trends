# Builds the Jhanvi Trends Android app (android/) and publishes the APK to the
# "android-latest" GitHub release, so phones can download it from one fixed link.
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # publish the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: "8.11.1"

      - name: Release signing key (optional)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the APK is signed with a temporary debug key. Updates will need an uninstall first. See android/README.md."
          fi

      - name: Build APK
        env:
          # PR builds are signed with the temporary debug key; the release key is only used on main.
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set +e
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler and Gradle errors as annotations (visible without downloading logs).
            grep -E '^e: |error:|What went wrong|Could not |FAILURE|> ' build.log | grep -v '^> Task' | head -40 |
              while IFS= read -r line; do echo "::error::${line//$'\n'/ }"; done
          fi
          exit "$status"

      - name: Name the APK
        id: apk
        run: |
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          out="JhanviTrends-1.0.${GITHUB_RUN_NUMBER}.apk"
          cp "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jhanvi-trends-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish to the android-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          title="Jhanvi Trends Android (build ${GITHUB_RUN_NUMBER})"
          notes="Latest Android build from ${GITHUB_SHA::7}. On your phone: download the APK below, open it and allow installing from this source."
          if gh release view android-latest >/dev/null 2>&1; then
            # Update in place so the release page never disappears: add the new APK first,
            # then remove older ones, then move the tag to this commit.
            gh release upload android-latest "$APK" --clobber
            gh release view android-latest --json assets -q '.assets[].name' | grep -vxF "$APK" |
              while IFS= read -r old; do gh release delete-asset android-latest "$old" --yes; done
            git push -f origin "${GITHUB_SHA}:refs/tags/android-latest"
            gh release edit android-latest --title "$title" --notes "$notes" --latest=false
          else
            gh release create android-latest "$APK" --title "$title" --notes "$notes" \
              --target "$GITHUB_SHA" --latest=false
          fi
