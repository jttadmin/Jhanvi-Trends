# Test (Dockerfile test stage) -> build -> scan -> push images for changed services, then bump their tags in the Helm
# values so Argo CD rolls them out (GitOps: the cluster is never touched from CI).
#
# Actions are pinned to commit SHAs (tag in the trailing comment); Dependabot keeps them current.
name: ci

on:
  push:
    branches: [main]
    paths: ["services/**", "deploy/charts/**", ".github/workflows/ci.yaml"]
  pull_request:
    paths: ["services/**", "deploy/charts/**", ".github/workflows/ci.yaml"]
  workflow_dispatch:
    inputs:
      all:
        description: Build every service
        type: boolean
        default: true

# PRs: a new push cancels the older run. main: every push runs to completion (one group per run),
# because a queued run that gets superseded would silently skip the services it changed.
# bump-tags copes with parallel runs on its own (rebase + retry, never moves a tag backwards).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: docker.io
  CHART: deploy/charts/jhanvi-trends

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            frontend: services/frontend/**
            user-service: services/user-service/**
            catalog-service: services/catalog-service/**
            cart-service: services/cart-service/**
            inventory-service: services/inventory-service/**
            order-service: services/order-service/**
            payment-service: services/payment-service/**
            notification-service: services/notification-service/**
            loadgen: services/loadgen/**
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ inputs.all }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" && "$ALL" == "true" ]]; then
            echo 'services=["frontend","user-service","catalog-service","cart-service","inventory-service","order-service","payment-service","notification-service","loadgen"]' >> "$GITHUB_OUTPUT"
          else
            echo "services=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          fi

  # Blocks PRs that add a dependency under a strong-copyleft or source-available license.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1
          fail-on-severity: critical

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Lint and render
        run: |
          helm lint "$CHART"
          helm template jhanvi-trends "$CHART" -n jhanvi-trends > "$RUNNER_TEMP/rendered.yaml"
          echo "Rendered $(grep -c '^kind:' "$RUNNER_TEMP/rendered.yaml") objects"
      - name: Validate against Kubernetes schemas
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" kubeconform
          # CRDs (ServiceMonitor, PrometheusRule, Certificate...) are checked against the community CRD catalog.
          "$RUNNER_TEMP/kubeconform" -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP/rendered.yaml"

  # Runs the "test" stage of each service's Dockerfile (format/lint, compile, unit tests), so tests use
  # exactly the toolchain the image is built with. Locally: docker build --target test services/<name>
  test:
    needs: changes
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Test stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/${{ matrix.service }}
          target: test
          outputs: type=cacheonly
          # Shares dependency layers with the image build below.
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=gha,scope=${{ matrix.service }}-test
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-test

  build:
    needs: [changes, test]
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload Trivy results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Image name
        id: img
        # One source of truth: the registry/namespace the chart deploys from.
        run: |
          base=$(yq -r '.global.imageRegistry' "$CHART/values.yaml")
          prefix=$(yq -r '.global.imagePrefix' "$CHART/values.yaml")
          echo "name=${base,,}/${prefix}${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=gha,scope=${{ matrix.service }}-test
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Vulnerability scan (Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        continue-on-error: true # not available on fork PRs
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}
      # Fails the build on CRITICAL vulnerabilities that already have a fix.
      # Set the repository variable TRIVY_BLOCK_CRITICAL to "false" to make it report-only.
      - name: Vulnerability gate (critical, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          skip-setup-trivy: true
          exit-code: ${{ vars.TRIVY_BLOCK_CRITICAL == 'false' && '0' || '1' }}
      - name: License scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.sha }}
          scanners: license
          severity: CRITICAL,HIGH,MEDIUM
          skip-setup-trivy: true
          exit-code: "0"
      - name: Record successful build
        run: |
          mkdir -p "$RUNNER_TEMP/built"
          echo "${{ matrix.service }}" > "$RUNNER_TEMP/built/${{ matrix.service }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: built-${{ matrix.service }}
          path: ${{ runner.temp }}/built/${{ matrix.service }}
          retention-days: 1

  # Bumps only the services whose image was built and pushed in this run, so one failing service
  # doesn't hold back the others.
  bump-tags:
    needs: [changes, build, helm-lint]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.helm-lint.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0 # history is needed to tell which of two image tags is newer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: built-*
          merge-multiple: true
          path: ${{ runner.temp }}/built
      - name: Point the chart at the new images and push
        run: |
          shopt -s nullglob
          built=("$RUNNER_TEMP"/built/*)
          if [ ${#built[@]} -eq 0 ]; then echo "Nothing was built successfully."; exit 0; fi

          git config user.name "jhanvi-trends-ci"
          git config user.email "jhanvi-trends-ci@users.noreply.github.com"

          bump() {
            for f in "${built[@]}"; do
              svc=$(basename "$f")
              if [[ "$svc" == "loadgen" ]]; then key='.loadgen.image.tag'; else key=".services.\"$svc\".image.tag"; fi
              current=$(yq -r "$key" "$CHART/values.yaml")
              # Never move a tag backwards: skip if the deployed tag is already a newer commit than ours.
              if [[ "$current" != "$GITHUB_SHA" ]] && git merge-base --is-ancestor "$GITHUB_SHA" "$current" 2>/dev/null; then
                echo "skip $svc: ${current::7} is newer than ${GITHUB_SHA::7}"
                continue
              fi
              yq -i "$key = \"${GITHUB_SHA}\"" "$CHART/values.yaml"
              echo "bumped $svc -> ${GITHUB_SHA::7}"
            done
          }

          # Other runs may push to main at the same time: rebuild the bump on the latest main and retry.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            bump
            git add "$CHART/values.yaml"
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "deploy: bump images to ${GITHUB_SHA::7} [skip ci]"
            if git push -q origin HEAD:main; then git show --stat HEAD; exit 0; fi
            echo "push rejected (attempt $attempt), retrying"
            sleep $((attempt * 3))
          done
          echo "::error::Could not push the tag bump after 5 attempts"
          exit 1
