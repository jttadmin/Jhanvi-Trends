# Finds and prepares free-license product photos for the seeded catalog (scripts/product-photos).
# Runs only on the product-photos branch and commits its results back to that branch.
name: product-photos

on:
  push:
    branches: [product-photos]
    paths: ["scripts/product-photos/queries.json", "scripts/product-photos/seeds.json", "scripts/product-photos/picks.json", "scripts/product-photos/photos.py", ".github/workflows/product-photos.yml"]
  workflow_dispatch:

concurrency:
  group: product-photos
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pillow==12.0.0
      - name: Candidates for products without a pick
        timeout-minutes: 15
        run: python scripts/product-photos/photos.py candidates 2>&1 | tee scripts/product-photos/candidates.log
      - name: Finalize picked photos
        run: |
          if [ -f scripts/product-photos/picks.json ]; then
            python scripts/product-photos/photos.py finalize 2>&1 | tee scripts/product-photos/finalize.log
            exit "${PIPESTATUS[0]}"
          fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/product-photos
          if [ -d services/catalog-service/app/photos ]; then git add -A services/catalog-service/app/photos; fi
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "product-photos: workflow results"
          # The branch may have moved while the job ran (e.g. a new picks.json push).
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
